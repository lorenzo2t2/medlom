<style>
/* Layout: one-screen app with three views — gallery (photos / projects), project, editor.
   Themes: dark, light, warm light, auto, high-contrast, sepia, blue-pro, forest, midnight */
:root, :root[data-tema="dark"]{
  --bg:#141619; --panel:#1d2024; --raise:#272b30; --line:#353a41;
  --fg:#ecebe6; --muted:#9a9fa6; --accent:#ffb21a; --accent-ink:#1b1400; --accent-text:#ffb21a;
  --danger:#ff5a4f; --hud:rgba(20,22,25,.9); --grid:rgba(255,255,255,.025); --field:#7a808a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dim-halo:rgba(0,0,0,.72);
  color-scheme:dark;
}
:root[data-tema="light"]{
  --bg:#f2f1ed; --panel:#ffffff; --raise:#e9e8e3; --line:#d6d4cd;
  --fg:#1b1d20; --muted:#62666c; --accent:#f5a300; --accent-ink:#1b1400; --accent-text:#9a6100;
  --danger:#b3261e; --hud:rgba(255,255,255,.94); --grid:rgba(0,0,0,.045); --field:#7b8088;
  --dim-halo:rgba(255,255,255,.85);
  color-scheme:light;
}
:root[data-tema="cream"]{
  --bg:#f7f4ec; --panel:#fffdf8; --raise:#eee9dd; --line:#d8d0c0;
  --fg:#24231f; --muted:#55534c; --accent:#e2a000; --accent-ink:#241900; --accent-text:#744900;
  --danger:#a82d25; --hud:rgba(255,253,248,.96); --grid:rgba(45,38,25,.045); --field:#625e53;
  --dim-halo:rgba(255,255,255,.95);
  color-scheme:light;
}
:root[data-tema="high"]{
  --bg:#000000; --panel:#0a0a0a; --raise:#1a1a1a; --line:#3a3a3a;
  --fg:#ffffff; --muted:#c0c0c0; --accent:#ffff00; --accent-ink:#000000; --accent-text:#ffff00;
  --danger:#ff3333; --hud:rgba(0,0,0,.92); --grid:rgba(255,255,255,.04); --field:#aaaaaa;
  --dim-halo:rgba(0,0,0,.9);
  color-scheme:dark;
}
:root[data-tema="sepia"]{
  --bg:#f4ecd8; --panel:#faf6eb; --raise:#ebe4d4; --line:#d4c9b0;
  --fg:#3d2b1f; --muted:#7a6550; --accent:#c45c26; --accent-ink:#2a1508; --accent-text:#8a3d12;
  --danger:#a12c2c; --hud:rgba(250,246,235,.95); --grid:rgba(0,0,0,.04); --field:#8a7a65;
  --dim-halo:rgba(250,246,235,.9);
  color-scheme:light;
}
:root[data-tema="blue"]{
  --bg:#0d1b2a; --panel:#1b2838; --raise:#243447; --line:#3a4f66;
  --fg:#e8f1f8; --muted:#8fa3b8; --accent:#00d4ff; --accent-ink:#001a22; --accent-text:#00d4ff;
  --danger:#ff6b6b; --hud:rgba(13,27,42,.92); --grid:rgba(255,255,255,.03); --field:#7a92a8;
  --dim-halo:rgba(0,0,0,.75);
  color-scheme:dark;
}
:root[data-tema="forest"]{
  --bg:#0f1a14; --panel:#1a2a20; --raise:#24352c; --line:#354a3d;
  --fg:#e8f0e9; --muted:#8fa896; --accent:#7dce82; --accent-ink:#0a1a0c; --accent-text:#7dce82;
  --danger:#e85d5d; --hud:rgba(15,26,20,.92); --grid:rgba(255,255,255,.03); --field:#7a9680;
  --dim-halo:rgba(0,0,0,.75);
  color-scheme:dark;
}
:root[data-tema="midnight"]{
  --bg:#0a0e17; --panel:#121826; --raise:#1a2233; --line:#2a3548;
  --fg:#e6eaf2; --muted:#8b95a8; --accent:#ff9f1c; --accent-ink:#1a0f00; --accent-text:#ff9f1c;
  --danger:#ff5c5c; --hud:rgba(10,14,23,.93); --grid:rgba(255,255,255,.025); --field:#7a8499;
  --dim-halo:rgba(0,0,0,.78);
  color-scheme:dark;
}
/* auto follows system, mapped to dark or light */
:root[data-tema="auto"][data-theme="light"]{
  --bg:#f2f1ed; --panel:#ffffff; --raise:#e9e8e3; --line:#d6d4cd;
  --fg:#1b1d20; --muted:#62666c; --accent:#f5a300; --accent-ink:#1b1400; --accent-text:#9a6100;
  --danger:#b3261e; --hud:rgba(255,255,255,.94); --grid:rgba(0,0,0,.045); --field:#7b8088;
  --dim-halo:rgba(255,255,255,.85);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-tema="auto"]:not([data-theme="dark"]){
    --bg:#f2f1ed; --panel:#ffffff; --raise:#e9e8e3; --line:#d6d4cd;
    --fg:#1b1d20; --muted:#62666c; --accent:#f5a300; --accent-ink:#1b1400; --accent-text:#9a6100;
    --danger:#b3261e; --hud:rgba(255,255,255,.94); --grid:rgba(0,0,0,.045); --field:#7b8088;
    --dim-halo:rgba(255,255,255,.85);
    color-scheme:light;
  }
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.app{height:100%;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.band{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.top{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;display:flex;align-items:center;gap:8px;min-height:44px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b span{color:var(--accent-text)}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.sub.on{color:var(--accent-text)}


.preview-sheet .prev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;max-height:42vh;overflow:auto}
.preview-sheet .prev-grid figure{margin:0;background:var(--raise);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.preview-sheet .prev-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.preview-sheet .prev-grid figcaption{font-size:11.5px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scaleInfo{cursor:pointer;-webkit-tap-highlight-color:transparent}
#scaleInfo:not(.on){border-color:var(--accent)!important;color:var(--accent-text)}
#scaleInfo.on{border-color:var(--line)}
body.in-editor #ctx:not([hidden])~#scaleInfo,#stage:has(.ctxbar:not([hidden])) #scaleInfo{display:none}
.titlebtn{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:2px 4px;border-radius:8px}
.titlebtn:hover{background:var(--raise)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;flex:none}
.ib:hover{background:var(--raise)}
.ib:disabled{opacity:.3;cursor:default;background:none}

/* ===== Pantalla principal de Espectro (copia de la referencia) ===== */
#interfaceHome:has(.esp-top){background:#04020c;padding:0;display:flex;flex-direction:column;overflow:hidden}

.esp-visor{position:relative;flex:1;min-height:0;container-type:size;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;background:linear-gradient(#04030c,#0a0420 60%,#12072e)}
.esp-stage{--w:min(100cqw,calc(100cqh/1.534));position:relative;flex:none;width:var(--w);height:min(100cqh,calc(var(--w)*1.9))}
.esp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.esp-round{position:absolute;left:90.4%;width:14.9%;aspect-ratio:1;transform:translate(-50%,-50%);padding:0;border-radius:50%;border:2.5px solid #b13cff;background:#0a0418;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 0 12px #a02cff99,inset 0 0 12px #7b2cd655;touch-action:manipulation}
.esp-round svg{width:50%;height:50%;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.esp-round:disabled{opacity:.5}
.esp-round:active:not(:disabled){transform:translate(-50%,-50%) scale(.94)}
.esp-round:focus-visible,.esp-shutter:focus-visible{outline:3px solid #fff;outline-offset:3px}
.esp-r1{top:22.7%}.esp-r2{top:35%}.esp-r3{top:47.3%}.esp-r4{top:59.4%}

.esp-top .esp-gear{position:static;transform:none;width:34px;height:34px;flex:none;box-shadow:0 0 8px #a02cff80}
.esp-top .esp-gear:active{transform:scale(.94)}
.esp-shutter{position:absolute;left:49.4%;top:86.8%;width:31%;aspect-ratio:1;transform:translate(-50%,-50%);padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}
.esp-ring{width:100%;height:100%;border-radius:50%;border:3px solid #fff;background:#0a0314;box-shadow:0 0 18px #d85bff,0 0 38px #9b2cff88,inset 0 0 16px #b03cff55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;font:600 min(19px,3.7cqw)/1.1 "Inter",var(--f-body)}

.esp-shutter:active .esp-ring{transform:scale(.95)}

/* ===== Pantalla principal de Prisma (copia de la referencia) ===== */

let toastT;function toast(m,ms){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.setAttribute('aria-live','polite');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||2400)}
const modals=[];
function openModal(html,{bottom=false,onClose}={}){
  const wrap=document.createElement('div');wrap.className='scrim'+(bottom?' bottom':'');wrap.innerHTML=html;document.body.appendChild(wrap);
  const prev=document.activeElement,sheet=wrap.querySelector('.sheet');
  if(sheet){if(!sheet.getAttribute('role'))sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');const h=sheet.querySelector('h2');if(h){h.id=h.id||'dlg'+Math.random().toString(36).slice(2,8);sheet.setAttribute('aria-labelledby',h.id)}}
  const focusables=()=>[...wrap.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,a[href],[tabindex="0"]')].filter(el=>!el.closest('[hidden]')&&el.offsetParent!==null);
  wrap.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=focusables();if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}});
  setTimeout(()=>{if(!wrap.contains(document.activeElement)){const f=focusables();(f.find(el=>el.matches('input,textarea,select'))||f[0]||sheet)?.focus?.()}},80);
  const m={wrap,close(silent){if(!wrap.isConnected)return;wrap.remove();const i=modals.indexOf(m);if(i>=0)modals.splice(i,1);try{if(prev&&prev.isConnected&&prev.focus)prev.focus({preventScroll:true})}catch(e){}if(!silent&&onClose)onClose()}};
  wrap.addEventListener('pointerdown',e=>{if(e.target===wrap)m.downOnScrim=true});
  wrap.addEventListener('click',e=>{if(e.target===wrap&&m.downOnScrim)m.close();m.downOnScrim=false});
  modals.push(m);return m;
}
function dialog(title,text,buttons){return new Promise(res=>{
  const m=openModal(`<div class="sheet" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${text?`<p class="txt" style="white-space:pre-line">${esc(text)}</p>`:''}<div class="col">${buttons.map(b=>`<button class="btn ${b.kind||'ghost'}" data-id="${b.id}">${esc(b.label)}</button>`).join('')}</div></div>`,{onClose:()=>res(null)});
  m.wrap.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b){m.close(true);res(b.dataset.id)}});
  setTimeout(()=>m.wrap.querySelector('.btn')?.focus(),30);
})}
function askText(title,value,placeholder,ok){return new Promise(res=>{
  const m=openModal(`<form class="sheet" autocomplete="off"><h2>${esc(title)}</h2><input type="text" id="askIn" enterkeyhint="done" aria-label="${esc(title)}" value="${esc(value||'')}" placeholder="${esc(placeholder||'')}" maxlength="80"><div class="row"><button type="button" class="btn ghost" data-c>Cancelar</button><button type="submit" class="btn primary">${esc(ok)}</button></div></form>`,{onClose:()=>res(null)});
  const f=m.wrap.querySelector('form'),i=f.querySelector('input');
  f.querySelector('[data-c]').onclick=()=>m.close();
  f.onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(!v){i.focus();return}m.close(true);res(v)};
  setTimeout(()=>{i.focus();i.select()},60);

/* navigation stack + phone back button */
const stack=[{v:'gallery',scope:null}];let pushed=0,forceLeave=false;
function pushView(entry){exitSel();stack.push(entry);try{history.pushState({cf:stack.length},'');pushed++}catch(e){}show()}
function requestBack(){if(stack.length<=1)return;if(pushed>0){try{history.back();return}catch(e){}}doBack()}
window.__medlomBack=()=>{if(modals.length){modals[modals.length-1].close();return true}if(stack[stack.length-1].v==='gallery'&&selMode){exitSel();renderGallery();return true}if(stack.length>1){doBack();return true}
  if(NATIVE&&SET.confirmExit){dialog('¿Salir de MedLoM?','Tus fotos y medidas guardadas se conservan.',[{id:'y',label:'Salir',kind:'primary'},{id:'n',label:'Cancelar'}]).then(r=>{if(r==='y'){try{NATIVE.exit()}catch(e){}}});return true}
  return false};
window.addEventListener('popstate',()=>{
  if(pushed>0)pushed--;
  if(modals.length){modals[modals.length-1].close();try{history.pushState({},'');pushed++}catch(e){}return}
  doBack();
});
/* a new photo that was never saved: leaving without saving removes it */
async function discardFresh(){
  const photo=rec;
  if(!photo?.fresh)return true;
  try{
    try{await ready(photo)}catch(e){}
    await del('photos',photo.id);
    addTomb('photo',photo.id);
  }catch(e){toast('No se pudo descartar la foto. Inténtalo de nuevo.');return false}
  delete photo.fresh;
  store.photos=store.photos.filter(x=>x.id!==photo.id);
  const project=photo.projectId&&projById(photo.projectId);
  if(project){project.updated=stamp(project.updated);put('projects',project).catch(()=>{})}
  toast('Foto descartada');
  return true;
}
async function doBack(){
  const top=stack[stack.length-1];if(stack.length<=1)return;
  if(top.v==='editor'&&!dirty()&&rec?.fresh&&!(await discardFresh())){
    try{history.pushState({},'');pushed++}catch(e){}
    return;
  }
  if(top.v==='editor'&&dirty()&&!forceLeave){
    try{history.pushState({},'');pushed++}catch(e){}
    const r=await dialog('¿Guardar los cambios?','Has añadido o cambiado medidas en esta foto.',[{id:'save',label:'Guardar',kind:'primary'},{id:'discard',label:'Salir sin guardar',kind:'danger'},{id:'stay',label:'Seguir editando'}]);
    if(!r||r==='stay')return;
    if(r==='save'&&!(await saveEditor()))return;
    if(r==='discard'&&rec?.fresh&&!(await discardFresh()))return;
    forceLeave=true;requestBack();return;
  }
  forceLeave=false;exitSel();stack.pop();if(top.v==='editor')closeEditor();show();
}
function show(){
  const top=stack[stack.length-1];
  document.body.classList.toggle('in-editor',top.v==='editor');
  
  $('#gallery').hidden=top.v!=='gallery';$('#editor').hidden=top.v!=='editor';$('#settings').hidden=top.v!=='settings';
  if(top.v==='gallery')renderGallery();if(top.v==='settings')renderSettings();

/* Fast import: decode off the main thread, scale once, open the editor right away and store in the background. */
const pending=new Map();
async function decodeFile(f){
  if(window.createImageBitmap){try{return await createImageBitmap(f,{imageOrientation:'from-image'})}catch(e){}}
  return bitmapOf(f,true);
}
async function importFile(f,pid,background){
  if(!DB.ok)throw Error("Almacenamiento local no disponible");
  const bmp=await decodeFile(f);const RQ=RES[SET.photoRes]||RES.normal,MAX=RQ.max;let w=bmp.naturalWidth||bmp.width,h=bmp.naturalHeight||bmp.height;const k=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(bmp,0,0,w,h);try{bmp.close&&bmp.close()}catch(e){}
  const now=Date.now(),d=new Date(now),name='Foto '+d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const rec={id:uid(),name,projectId:pid,created:now,updated:now,img:null,thumb:null,w,h,objs:[],calib:null};
  const job=(async()=>{rec.thumb=await makeThumb(rec,c);rec.img=await toBlob(c,'image/jpeg',RQ.q);await put('photos',rec)})();
  pending.set(rec.id,job);store.photos.push(rec);
  job.then(()=>{pending.delete(rec.id);if(!$('#gallery').hidden)renderGallery();scheduleSync()},()=>{pending.delete(rec.id);if(background)store.photos=store.photos.filter(p=>p!==rec);toast('No se pudo guardar la foto. Comprueba el espacio libre.')});
  if(!background)await Promise.resolve();else await job;
  return {rec,canvas:c};
}

const safe=s=>String(s).replace(/[\\/:*?"<>|\n]+/g,'-').trim().slice(0,80)||'foto';
function measuresOf(rec){
  const rows=[];
  for(const o of rec.objs||[]){
    if(o.type==='dim')rows.push(['Cota'+(o.ref?' (referencia)':'')+(o.chain?' en cadena':''),o.val||'?',o.unit||'']);
    else if(o.type==='poly')rows.push(['Área',...(o.val||'?').split(' ')]);
    else if(o.type==='angle')rows.push(['Ángulo',(o.val||'').replace('°',''),'°']);
    else if((o.type==='rect'||o.type==='ellipse')&&o.lbl){const u=o.unit||'cm',S=(()=>{const c={...o};return c})();
      const parts=[o.lbl.w&&o.lbl.h?`${o.lbl.w} × ${o.lbl.h}`:'',...(o.lbl.c||'').split('\n')].filter(Boolean);rows.push([o.type==='rect'?'Rectángulo':isCircle(o)?'Círculo':'Elipse',parts.join(' · '),''])}
    else if(o.type==='plane'&&o.rw)rows.push(['Plano de referencia',`${fmt(o.rw,o.unit)} × ${fmt(o.rh,o.unit)}`,o.unit||'']);
    else if(o.type==='text'&&o.text)rows.push(['Nota',o.text.replace(/\n/g,' '),'']);
  }
  return rows;
}
function csvOf(entries){
  const q=v=>{v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[['Proyecto','Foto','Fecha','Tipo','Medida','Unidad'].join(';')];
  for(const {rec} of entries){const pj=rec.projectId&&projById(rec.projectId);for(const r of measuresOf(rec))lines.push([pj?pj.name:'',rec.name,fmtDate(rec.updated),...r].map(q).join(';'))}
  return '﻿'+lines.join('\r\n');
}

const DEF_PDF={cover:'proj',coverPhotos:false,coverDate:true,coverCount:true,coverNotes:true,coverText:'',logo:null,header:true,headerDate:true,headerProject:true,footer:true,footerBrand:true,footerPages:true,perPage:1,table:'after',margin:'normal'};

  const drawTable=(title,rows)=>{page('p');const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();let y=mg+12;
    doc.setTextColor(25,25,25);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(title,mg+3,y);y+=10;

    rows.forEach((r,i)=>{const w2=multi?(col[3]-col[2]-4):(col[3]-col[2]-4),lines=doc.splitTextToSize(String(r.v[1]),w2),pl=multi?doc.splitTextToSize(String(r.photo),46):[''],hgt=Math.max(lines.length,pl.length)*5+3;
      if(y+hgt>ph-bot-4){page('p');y=mg+12;head()}

  for(const g of groups){

      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(110,110,110);

      const pn=g.items[0].rec.projectId&&projById(g.items[0].rec.projectId),nt=P.coverNotes&&g.k&&pn&&pn.notes;
      if(nt&&(nt.client||nt.address)){doc.setTextColor(30,30,30);const ln=[nt.client?'Cliente: '+nt.client:'',nt.address?'Dirección: '+nt.address:''].filter(Boolean).join('   ·   ');const ls=doc.splitTextToSize(ln,TW);doc.text(ls,L,yy);yy+=ls.length*4.6+1}
      if(nt&&nt.text){doc.setTextColor(60,60,60);doc.setFontSize(9.5);const ls=doc.splitTextToSize(nt.text,TW).slice(0,4);doc.text(ls,L,yy);yy+=ls.length*4.3+1}

      const tt=doc.splitTextToSize(g.k||(entries.length===1?entries[0].rec.name:clean?'Fotos':'Fotos con medidas'),pw-40);doc.text(tt,20,yy+28);yy+=28+tt.length*11;
      doc.setFont('helvetica','normal');doc.setFontSize(12);doc.setTextColor(110,110,110);
      const sub=[P.coverCount?`${g.items.length} ${g.items.length===1?'foto':'fotos'}${clean?' originales':' con medidas'}`:'',P.coverDate?today:''].filter(Boolean).join(' · ');if(sub){doc.text(sub,20,yy);yy+=8}
      if(SET.pdfAuthor){doc.setFontSize(11);doc.text(String(SET.pdfAuthor),20,yy);yy+=8}
      if(P.coverText){yy+=4;doc.setTextColor(30,30,30);doc.setFontSize(12);const ct=doc.splitTextToSize(P.coverText,pw-40);doc.text(ct,20,yy);yy+=ct.length*6}
      const pn=g.items[0].rec.projectId&&projById(g.items[0].rec.projectId),nt=P.coverNotes&&g.k&&pn&&pn.notes;
      if(nt&&(nt.client||nt.address||nt.text)){yy+=6;doc.setDrawColor(220,220,220);doc.line(20,yy,pw-20,yy);yy+=10;doc.setFontSize(11);
        for(const [k,v] of [['Cliente',nt.client],['Dirección',nt.address]])if(v){doc.setTextColor(120,120,120);doc.text(k,20,yy);doc.setTextColor(30,30,30);doc.text(doc.splitTextToSize(v,pw-70),55,yy);yy+=8}
        if(nt.text){yy+=2;doc.setTextColor(30,30,30);doc.text(doc.splitTextToSize(nt.text,pw-40),20,yy)}}}
    const per=Math.max(1,P.perPage|0);
    for(let i=0;i<g.items.length;i+=per){

      for(const e of chunk){prog(`Foto ${++done} de ${entries.length}`);cs.push(await renderAnnotated(e.rec,Q.max||3200,undefined,clean));await new Promise(r=>setTimeout(r,0))}
      const r0=chunk[0].rec,pj=r0.projectId&&projById(r0.projectId);
      const subOf=rec=>[P.headerProject&&pj?pj.name:'',P.headerDate?fmtDate(rec.updated):''].filter(Boolean).join(' · ');
      let T=top;const onCover=carry!=null;
      if(onCover){T=carry;carry=null;if(P.header&&chunk.length===1){doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(25,25,25);doc.text(String(r0.name),mg,T+3);doc.setFont('helvetica','normal');T+=6}}

        cs.forEach((c,ix)=>{const y0=T+ix*(slot+6),k=Math.min(bw/c.width,(slot-6)/c.height),iw=c.width*k,ih=c.height*k;doc.addImage(c.toDataURL('image/jpeg',Q.q),'JPEG',mg+(bw-iw)/2,y0+(slot-6-ih)/2,iw,ih,undefined,'FAST');

async function exportEntries(entries,name,covers){
  const opt=await exportOptions(entries);if(!opt)return;const fmtSel=opt.f,clean=opt.clean;
  if(fmtSel==='csv'){shareSheet(new Blob([csvOf(entries)],{type:'text/csv'}),safe(name)+' - medidas.csv',entries);return}
  const n=entries.length;
  const m=openModal(`<div class="sheet"><h2>Preparando ${n} ${n===1?'foto':'fotos'}…</h2><p class="txt" id="prog">${clean?'Preparando las fotos originales':'Dibujando medidas a resolución completa'}</p><div class="spin"></div></div>`);
  const prog=t=>{const p=m.wrap.querySelector('#prog');if(p)p.textContent=t};
  try{
    let out,fname;
    const Q=EXQ[SET.expQuality]||EXQ.high;
    if(fmtSel==='jpg'){const files=[],used=new Set();let i=0;
      for(const {rec} of entries){prog(`Foto ${++i} de ${entries.length}`);let b;
        if(clean){await ready(rec);b=rec.img;if(!b||!/jpe?g/.test(b.type||''))b=await toBlob(await renderAnnotated(rec,undefined,undefined,true),'image/jpeg',0.95)}
        else b=await toBlob(await renderAnnotated(rec,Q.max||undefined),'image/jpeg',Q.q);
        let base=safe(rec.name)+(clean?' (original)':''),fn=base+'.jpg',k=2;while(used.has(fn))fn=base+' '+(k++)+'.jpg';used.add(fn);files.push({blob:b,name:fn});await new Promise(r=>setTimeout(r,0))}
      m.close(true);if(files.length===1)previewExport(files[0].blob,files[0].name,entries,clean);else shareMany(files,entries);return}
    else{out=await buildPdf(entries,covers,prog,clean);fname=safe(name)+(clean?' (originales)':'')+'.pdf'}
    m.close(true);previewExport(out,fname,entries,clean);
  }catch(err){m.close(true);toast(err&&err.message==='pdf'?'No se pudo crear el PDF. Comprueba la conexión y vuelve a intentarlo.':'No se pudo preparar la exportación')}
}
/* PC (Chrome/Edge): save straight into a MedLoM folder the user picks once (normally inside Documentos) */
const CAN_DIR=WEBAPP&&typeof window.showDirectoryPicker==='function';
async function saveToDir(files){
  let h=null;try{const r=await getOne('meta','dirMedlom');h=r&&r.v}catch(e){}
  if(h){try{let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});if(p!=='granted')h=null}catch(e){h=null}}
  if(!h){toast('Elige la carpeta Documentos: MedLoM creará dentro su carpeta');let base;
    try{base=await window.showDirectoryPicker({id:'medlom',mode:'readwrite',startIn:'documents'})}catch(e){if(e&&e.name==='AbortError')return null;throw e}
    h=base.name==='MedLoM'?base:await base.getDirectoryHandle('MedLoM',{create:true});try{await put('meta',{id:'dirMedlom',v:h})}catch(e){}}
  for(const f of files){let nm=f.name;const dot=nm.lastIndexOf('.'),b0=dot>0?nm.slice(0,dot):nm,ext=dot>0?nm.slice(dot):'';
    for(let n=2;n<500;n++){try{await h.getFileHandle(nm);nm=`${b0} (${n})${ext}`}catch(e){break}}
    const fh=await h.getFileHandle(nm,{create:true}),w=await fh.createWritable();await w.write(f.blob);await w.close()}
  return h.name}
async function dirSave(m,files){try{const n=await saveToDir(files);if(n){m.close(true);toast(files.length>1?'Guardadas en la carpeta '+n:'Guardado en la carpeta '+n)}}catch(err){toast('No se pudo guardar en esa carpeta. Prueba con otra.')}}
function shareMany(files,entries){
  const tot=files.reduce((a,f)=>a+f.blob.size,0),mb=(tot/1048576).toLocaleString('es-ES',{maximumFractionDigits:1}),info=`<p class="txt"><b>${files.length} imágenes JPG</b> · ${mb} MB</p>`;
  const nativeMany=NATIVE&&typeof NATIVE.finishMany==='function';
  if(nativeMany){
    const m=openModal(`<div class="sheet"><h2>Listo para compartir</h2>${info}<div class="col"><button class="btn primary" data-a="share">${IC.share}Compartir (WhatsApp, Correo…)</button><button class="btn ghost" data-a="save">Guardar en Documentos › MedLoM</button><button class="btn ghost" data-c>Cerrar</button></div></div>`);
    m.wrap.addEventListener('click',async e=>{if(e.target.closest('[data-c]'))return m.close();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
      if(b.dataset.a==='save')return nativeSaveFlow(m,a=>sendManyToNative(files,'image/jpeg',a),'Guardadas en Documentos › MedLoM');
      m.wrap.querySelectorAll('[data-a]').forEach(x=>x.disabled=true);
      try{const r=await sendManyToNative(files,'image/jpeg',b.dataset.a);if(r&&r.indexOf('error')===0)throw new Error(r);m.close(true);toast(b.dataset.a==='save'?'Guardadas en Descargas › MedLoM':'Elige dónde compartirlas')}
      catch(err){m.wrap.querySelectorAll('[data-a]').forEach(x=>x.disabled=false);toast('No se pudo completar. Inténtalo de nuevo.')}});
    return}
  const fl=files.map(f=>new File([f.blob],f.name,{type:'image/jpeg'}));let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:fl}))}catch(e){}
  const m=openModal(`<div class="sheet"><h2>Listo para compartir</h2>${info}<div class="col">${canShare?`<button class="btn primary" data-a="share">${IC.share}Compartir (WhatsApp, Correo, Archivos…)</button>`:''}${CAN_DIR?`<button class="btn ${canShare?'ghost':'primary'}" data-a="dir">Guardar en Documentos › MedLoM</button>`:''}<button class="btn ${canShare||CAN_DIR?'ghost':'primary'}" data-a="dl">Descargar las ${files.length} imágenes</button><button class="btn ghost" data-c>Cerrar</button></div></div>`);
  m.wrap.addEventListener('click',async e=>{if(e.target.closest('[data-c]'))return m.close();const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='dir')return dirSave(m,files);
    if(b.dataset.a==='share'){try{await navigator.share({files:fl});m.close(true)}catch(err){if(err&&err.name!=='AbortError')toast('No se pudo compartir')}return}
    m.close(true);

    await put('meta',{id:k,img:rec.img,w:rec.w,h:rec.h,objs:JSON.parse(JSON.stringify(objs)),calib:calib?JSON.parse(JSON.stringify(calib)):null,at:Date.now()})}catch(e){}
}
async function restoreOriginal(){

  src=await bitmapOf(o.img);W=o.w;H=o.h;rec.img=o.img;rec.w=W;rec.h=H;rec.imgRev=(rec.imgRev||0)+1;imgChanged=false;
  objs=o.objs||[];calib=o.calib||null;sel=-1;needFit=true;fit();recalc();

}

      const meta={id:r.id,name:r.name,projectId:r.projectId||null,created:r.created,updated:r.updated,w:r.w,h:r.h,objs:r.objs||[],calib:r.calib||null,imgRev:r.imgRev||0};
      const props={updated:String(r.updated),annot,annotIn:dest,annotRev:String(r.updated)};
      const nid=await gUpload({id:j&&j.id,name:`f_${r.id}.json`,parent:dataId,mime:'application/json',data:JSON.stringify(meta),props});
      byName.set(`f_${r.id}.json`,{id:nid,name:`f_${r.id}.json`,appProperties:props});

    for(const [key,f] of projFolders){if(key!=='none'&&gone[key]&&!merged.has(key))await gDel(f.id)}
    /* download remote changes */
    for(const f of byName.values()){
      const m=/^f_(.+)\.json$/.exec(f.name);if(!m)continue;
      const id=m[1],ap=f.appProperties||{},ru=+(ap.updated||0),l=store.photos.find(p=>p.id===id);
      if(rec&&rec.id===id)continue;
      if(ap.deleted==='1'){if(l&&(l.updated||0)<=ru){await del('photos',id);store.photos=store.photos.filter(p=>p.id!==id);changed=true}continue}
      if(l&&(l.updated||0)>=ru)continue;

      let img=l&&l.img;
      if(!img||String((l&&l.imgRev)||0)!==String(meta.imgRev||0)){const ji=byName.get(`f_${id}.jpg`);if(!ji)continue;img=await gGet(ji.id)}
      const n={...(l||{}),...meta,objs:meta.objs||[],calib:meta.calib||null,img:img.type==='image/jpeg'?img:new Blob([img],{type:'image/jpeg'}),thumb:null};
      if(n.projectId&&!projById(n.projectId))n.projectId=null;
      n.thumb=await makeThumb(n);await put('photos',n);
      if(l)Object.assign(l,n);else store.photos.push(n);changed=true;
    }
    await syncRotulacionDrive(dataId,byName);
    SET.drive={...(SET.drive||{}),lastSync:Date.now()};saveSettings();
    DRIVE.busy=false;setDrive('ok');
    if(manual&&!SYNC_ALL)toast('Google Drive al día');
  }catch(e){
    DRIVE.busy=false;
    if(e.wait){setDrive('wait',e.message)}
    else if(e.auth){setDrive('error','vuelve a conectar Google Drive')}
    else setDrive('error',/Failed to fetch|NetworkError/i.test(e.message)?'sin conexión a internet':e.message);
    if(manual)toast('No se pudo sincronizar');
  }finally{
    DRIVE.busy=false;
    if(changed&&!$('#gallery').hidden)renderGallery();
    if(DRIVE.again){DRIVE.again=false;scheduleSync(800)}
  }
}

  if(r.calib){if(r.calib.ppmm)r.calib.ppmm*=k;if(r.calib.plane)r.calib.plane.pts.forEach(sp)}}

      if(k<1)scaleRec(rc,c.width/rc.w);rc.w=c.width;rc.h=c.height;rc.img=await toBlob(c,'image/jpeg',RQ.q);rc.imgRev=(rc.imgRev||0)+1;rc.updated=stamp(rc.updated);rc.thumb=await makeThumb(rc,c);await put('photos',rc);after+=rc.img.size}catch(e){}}

const LASER={state:'',msg:'',found:[],last:null};
function hasLaser(){try{return !!(NATIVE&&NATIVE.hasLaser&&NATIVE.hasLaser())}catch(e){return false}}
window.__medlomLaserState=o=>{const quiet=LASER.auto&&o.state!=='connected';if(o.state!=='connecting')LASER.auto=false;LASER.state=o.state;LASER.generic=o.msg==='generic';LASER.msg=o.msg==='generic'?'':o.msg||'';if(o.state==='connected')toast('Medidor conectado: '+(o.name||''));if(o.msg&&o.state!=='connected'&&!quiet)toast(o.msg);if(!$('#settings').hidden)renderSettings();laserBadge();window.dispatchEvent(new Event("medlom-laser-state"))};

window.__medlomLaser=o=>{
  const m=o.m;LASER.last={m,at:Date.now()};
  if(LASER.fill){LASER.fill(m);LASER.last=null;return}
  if(laserToField(m)||laserToRoom(m)){LASER.last=null;buzz();return}
  if(rec&&!$('#editor').hidden&&sel>=0&&objs[sel]&&objs[sel].type==='dim'){const d=objs[sel];d.val=fmt(m*1000/TOMM[d.unit||'mm'],d.unit);d.auto=false;
    if(d.ref){const n=parseNum(d.val);if(n>0)setPpmm(len(d.a,d.b)/(n*TOMM[d.unit||'mm']))}recalc();commit();render();LASER.last=null;toast(`Láser: ${fmt(m,'m')} m aplicado a la cota`);buzz();return}
  toast(`Láser: ${fmt(m,'m')} m · ${rec?'se usará en la próxima cota':'abre una foto y selecciona una cota'}`);buzz();
};
function laserBadge(){const on=LASER.state==='connected';document.querySelectorAll('#laserBadge,[data-laser-btn]').forEach(b=>{b.hidden=!hasLaser();b.style.opacity=on?'1':'.55';b.style.borderStyle=on?'solid':'dashed';b.title=on?'Medidor láser conectado':'Medidor láser sin conectar: toca para conectar'})}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('#laserBadge,[data-laser-btn]');if(!b)return;
  const inRoom=stack.length&&stack[stack.length-1].v==='room';
  const st=LASER.state;

    if(d&&LASER.last&&Date.now()-LASER.last.at<120000)window.__medlomLaser({m:LASER.last.m,name:''});
    else toast(inRoom?'Láser conectado: elige una pared y mide; el valor se pone y pasa a la siguiente pared. Si tocas un campo (altura, texto), se escribe ahí.':'Láser conectado: selecciona una cota (o dibuja una) y mide con el aparato; el valor se pone solo.');return}
  if(st==='connecting'||st==='scanning'){toast('Conectando con el medidor…');return}
  if(SET.laser&&SET.laser.addr){toast('Conectando con el medidor…');laserConnectNow(SET.laser.addr,SET.laser.name);return}
  toast('Primero conecta el medidor en Ajustes › Medidor láser')});
setTimeout(laserBadge,0);window.addEventListener('load',laserBadge);
function laserRow(){
  const st=LASER.state,dev=SET.laser,found=LASER.found||[];

  for(const j of jobs){
    const base=rotSafeName(j.name,'Trabajo de rotulación');let folder=base,k=2;while(used.has(folder.toLowerCase()))folder=base+' ('+(k++)+')';used.add(folder.toLowerCase());

/* Plantillas comerciales locales: un solo atlas ligero por vehículo. */
let vehicleTemplateLibrary=null;
const vehicleTemplateBase='./rotulom/artwork/templates/';
async function vehicleTemplates(){
  if(vehicleTemplateLibrary)return vehicleTemplateLibrary;
  const r=await fetch(vehicleTemplateBase+'manifest.json');
  if(!r.ok)throw Error('No se pudo abrir la biblioteca de plantillas');
  const data=await r.json();
  if(data.version!==1||!Array.isArray(data.models)||data.models.length>2000)throw Error('Biblioteca no compatible');
  for(const model of data.models){
    if(!/^[a-z0-9-]+$/.test(model.id)||!/^[a-z0-9-]+\.webp$/.test(model.atlas))throw Error('Referencia de plantilla no válida');
    for(const view of ['frontal','lateral','trasera','superior'])vehicleTemplatePlan(model,view);
  }
  vehicleTemplateLibrary=data.models;return vehicleTemplateLibrary;
}
async function openVehicleTemplates(){

  const shrink=(els,availOf)=>{
    for(let n=0;n<5;n++){
      let k=1;for(const e of els){const w=width(e),a=availOf(e);if(w>a)k=Math.min(k,a/w*.99);}
      if(k>=1)return;
      for(const e of els){const cur=parseFloat(e.style.fontSize)||parseFloat(getComputedStyle(e).fontSize);e.style.fontSize=(cur*k)+'px';}
    }
  };
  const fit=()=>{
    const full=interfaceHome.clientWidth;if(!full)return;
    const h1=interfaceHome.querySelector('.pr-poster h1');
    if(h1){h1.style.fontSize='';shrink([h1],()=>full*.84);}
    const spans=[...interfaceHome.querySelectorAll('.pr-row span')];
    if(spans.length){spans.forEach(s=>s.style.fontSize='');
      shrink(spans,s=>{const r=s.parentElement;return Math.max(60,full-((r.querySelector('sup')?.offsetWidth||0)+(r.querySelector('svg')?.getBoundingClientRect().width||0)+56));});}
  };
  fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!interfaceHome.hidden)fit();});
}

/* ================= Plano: añadir puertas, ventanas y enchufes a una pared a partir de una foto ================= */
const PFOTO_TYPES={door:'Puerta',window:'Ventana',socket:'Enchufe',switch:'Interruptor'};
async function roomFromPhoto(){
  try{flushRoomInputs()}catch(err){toast(err.message);return}
  const r=ROOMUI.model,w=r&&r.walls.find(x=>x.id===ROOMUI.selected);if(!w)return;
  if(!w.lengthMm||!r.heightMm){toast('Mide esta pared e introduce la altura de pared antes de añadir elementos');return}
  const photos=(store.photos||[]).filter(p=>!p.deleted).sort((a,b)=>(b.updated||0)-(a.updated||0));
  const pick=openModal(`<div class="sheet"><h2>Elige la foto de ${esc(RoomPlan.segmentLabel(r,w))}</h2><p class="note">Mejor con la pared de frente y enderezada, y con una medida de referencia (así salen las medidas reales).</p>
    <button class="btn primary" data-cam style="width:100%;margin-bottom:8px">Hacer foto de esta pared ahora</button><div class="plist">${photos.slice(0,40).map(p=>`<button data-p="${esc(p.id)}" style="display:flex;gap:10px;align-items:center;text-align:left"><img src="${thumbURL(p)}" alt="" style="width:64px;height:48px;object-fit:cover;border-radius:6px"><span>${esc(p.name)}${p.calib&&(p.calib.ppmm||p.calib.plane)?'<br><small>con escala</small>':'<br><small>sin escala</small>'}</span></button>`).join('')}</div>
    <div class="row"><button class="btn ghost" data-c>Cancelar</button></div></div>`,{bottom:true});
  pick.wrap.addEventListener('click',async e=>{if(e.target.closest('[data-c]'))return pick.close();
    if(e.target.closest('[data-cam]')){pick.close(true);ROOMUI.photoWall=w.id;ROOMUI.photoAt=Date.now();$('#fileCam').click();return}const b=e.target.closest('[data-p]');if(!b)return;pick.close(true);
    const p=photos.find(x=>x.id===b.dataset.p);if(!p)return;
    const busy=openModal('<div class="sheet"><h2>Buscando puertas, ventanas y enchufes…</h2><div class="spin"></div></div>');
    let img=null,list=[];try{if(!p.img)await ready(p);img=await bitmapOf(p.img);list=FotoAuto.detect(img,null)}catch(err){}
    busy.close(true);
    if(!img||!list.length){dialog('Añadir desde foto','No he encontrado puertas, ventanas ni enchufes claros en esa foto. Prueba con la pared de frente (Enderezar → Perspectiva → Automático).',[{id:'ok',label:'Cerrar',kind:'primary'}]);return}
    roomPhotoSheet(r,w,p,img,list);
  });
}
// píxeles de la foto -> mm reales (escala de la foto) o, sin escala, la foto se supone que abarca toda la pared
function roomPhotoMapper(r,w,p,img){
  const cal=p.calib;if(cal&&cal.plane&&typeof homography==='function'){const pl=cal.plane,mw=pl.w*TOMM[pl.unit||'mm'],mh=pl.h*TOMM[pl.unit||'mm'],h=homography(pl.pts,[{x:0,y:0},{x:mw,y:0},{x:mw,y:mh},{x:0,y:mh}]);
    if(h)return{f:q=>applyH(h,q),scaled:true}}
  if(cal&&cal.ppmm>0)return{f:q=>({x:q.x/cal.ppmm,y:q.y/cal.ppmm}),scaled:true};
  return{f:q=>({x:q.x*w.lengthMm/img.width,y:q.y*r.heightMm/img.height}),scaled:false};
}
function roomPhotoSheet(r,w,p,img,list){
  const map=roomPhotoMapper(r,w,p,img),u=roomUnit(),k=TOMM[u],lab=RoomPlan.segmentLabel(r,w),items=list.map(c=>({...c,t:c.type==='socket'?'socket':c.type,on:c.type!=='socket'}));
  const m=openModal(`<form class="sheet" autocomplete="off"><h2>Añadir a ${esc(lab)}</h2>
    <canvas id="pfCv" style="width:100%;border-radius:10px;background:#000" aria-label="Foto con los elementos detectados"></canvas>
    <p class="note">${map.scaled?'Medidas calculadas con la escala de la foto.':'Esta foto no tiene escala: se supone que abarca toda la pared (de esquina a esquina y de suelo a techo); para más precisión haz la foto con la pared entera dentro.'} Revisa los datos antes de añadir.</p>
    ${map.scaled?`<div class="room-opening-form"><label class="col"><span>Esquina izquierda → borde izquierdo de la foto (${esc(u)})</span><input name="ml" type="number" step="any" inputmode="decimal" value="0"></label>
    <label class="col"><span>Suelo → borde inferior de la foto (${esc(u)})</span><input name="mb" type="number" step="any" inputmode="decimal" value="0"></label></div>`:''}
    <div class="det-list" id="pfList"></div>
    <div class="row"><button type="button" class="btn ghost" data-c>Cancelar</button><button class="btn primary" type="submit">Añadir seleccionados</button></div></form>`);
  const f=m.wrap.querySelector('form'),cv=f.querySelector('#pfCv'),listEl=f.querySelector('#pfList');
  const margins=()=>({l:Number(f.elements.ml?.value||0)*k||0,b:Number(f.elements.mb?.value||0)*k||0});
  const geom=c=>{const A=map.f({x:c.x,y:c.y}),B=map.f({x:c.x+c.w,y:c.y+c.h}),mg=margins(),widthMm=Math.abs(B.x-A.x),heightMm=Math.abs(B.y-A.y),bottomMm=Math.abs(map.f({x:0,y:img.height}).y-B.y);
    const left=Math.min(A.x,B.x)+mg.l,sill=c.t==='door'?0:Math.max(0,bottomMm+mg.b);return{widthMm,heightMm,left,sill}};
  const paint=()=>{const s=Math.min(1,900/Math.max(img.width,img.height));cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);const g=cv.getContext('2d');g.drawImage(img,0,0,cv.width,cv.height);
    items.forEach((c,i)=>{g.globalAlpha=c.on?1:.35;g.strokeStyle=DET_COLORS[c.t==='switch'?'socket':c.t];g.lineWidth=Math.max(2,cv.width/300);g.strokeRect(c.x*s,c.y*s,c.w*s,c.h*s);const fs=Math.max(12,cv.width/38);g.fillStyle=g.strokeStyle;g.fillRect(c.x*s,c.y*s,fs*1.2,fs*1.2);g.fillStyle='#000';g.font='bold '+fs+'px sans-serif';g.fillText(String(i+1),c.x*s+fs*.28,c.y*s+fs*.95);g.globalAlpha=1})};
  const rows=()=>{listEl.innerHTML=items.map((c,i)=>{const g=geom(c),v=x=>fmt(x/k,u);return`<label class="det-row" style="flex-wrap:wrap"><input type="checkbox" data-i="${i}" ${c.on?'checked':''}><b>${i+1}</b>
    <select data-t="${i}">${Object.keys(PFOTO_TYPES).map(t=>`<option value="${t}" ${t===c.t?'selected':''}>${PFOTO_TYPES[t]}</option>`).join('')}</select>
    <span class="sub" style="flex-basis:100%;padding-left:34px">${v(g.widthMm)} × ${v(g.heightMm)} ${u} · a ${v(g.left)} de la esquina izquierda · a ${v(g.sill)} del suelo</span></label>`}).join('')};
  rows();paint();
  f.addEventListener('change',e=>{const ci=e.target.closest('[data-i]'),ti=e.target.closest('[data-t]');if(ci)items[+ci.dataset.i].on=ci.checked;if(ti)items[+ti.dataset.t].t=ti.value;rows();paint()});
  f.addEventListener('input',e=>{if(e.target.name==='ml'||e.target.name==='mb'){rows();paint()}});
  f.querySelector('[data-c]').onclick=()=>m.close();
  f.onsubmit=e=>{e.preventDefault();let n=r,added=0,failed=[];
    items.forEach((c,i)=>{if(!c.on)return;const g=geom(c),fix=c.t==='socket'||c.t==='switch';
      const wMm=Math.max(fix?40:200,Math.round(g.widthMm)),hMm=Math.max(fix?40:200,Math.round(g.heightMm));
      try{n=RoomPlan.addOpening(n,w.id,{id:uid(),type:c.t,widthMm:wMm,heightMm:hMm,offsetMm:RoomPlan.frontOffset(n,w.id,Math.max(0,g.left),wMm),sillMm:Math.round(g.sill),referenceId:null});added++}
      catch(err){failed.push(`${i+1}: ${err.message}`)}});
    m.close(true);if(added){ROOMUI.selected=w.id;roomChange(n)}
    toast(added?`${added} ${added===1?'elemento añadido':'elementos añadidos'} a ${lab}${failed.length?' · no caben: '+failed.length:''}`:(failed[0]||'No has marcado ningún elemento'),failed.length?5000:2600)};
}

// Foto hecha desde la pared del Plano: se endereza sola si hace falta y se propone qué añadir
function pfRectify(img){
  const q=FotoAuto.quad(img);if(!q)return img;
  const Q=q.map(p=>({x:p.x*img.width,y:p.y*img.height})),d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  let ow=Math.max(d(Q[0],Q[1]),d(Q[3],Q[2])),oh=Math.max(d(Q[0],Q[3]),d(Q[1],Q[2]));const k=Math.min(1,1400/Math.max(ow,oh));ow=Math.max(20,Math.round(ow*k));oh=Math.max(20,Math.round(oh*k));
  const h=homography([{x:0,y:0},{x:ow,y:0},{x:ow,y:oh},{x:0,y:oh}],Q);if(!h)return img;
  const sc=document.createElement('canvas');sc.width=img.width;sc.height=img.height;sc.getContext('2d').drawImage(img,0,0);
  const sd=sc.getContext('2d').getImageData(0,0,sc.width,sc.height).data,out=document.createElement('canvas');out.width=ow;out.height=oh;const og=out.getContext('2d'),id=og.createImageData(ow,oh),o=id.data,hh=h[8]||1;
  for(let y=0;y<oh;y++)for(let x=0;x<ow;x++){const w=(h[6]*x+h[7]*y+hh),px=Math.round((h[0]*x+h[1]*y+h[2])/w-.5),py=Math.round((h[3]*x+h[4]*y+h[5])/w-.5),j=(y*ow+x)*4;
    if(px<0||py<0||px>=sc.width||py>=sc.height){o[j]=o[j+1]=o[j+2]=255;o[j+3]=255;continue}const a=(py*sc.width+px)*4;o[j]=sd[a];o[j+1]=sd[a+1];o[j+2]=sd[a+2];o[j+3]=255}
  og.putImageData(id,0,0);return out;
}
async function roomAfterPhoto(made){
  const r=ROOMUI.model,w=r&&r.walls.find(x=>x.id===ROOMUI.photoWall);ROOMUI.photoWall=null;
  if(!w){openEditor(made.rec,made.canvas);return}
  ROOMUI.selected=w.id;
  const busy=openModal('<div class="sheet"><h2>Analizando la foto…</h2><div class="spin"></div></div>');
  await new Promise(res=>setTimeout(res,60));
  let img=made.canvas,list=[],msg='';
  try{const a=FotoAuto.analyze(img);msg=a.msg;if(a.level==='warn'||a.level==='bad'){const r2=pfRectify(img);if(r2!==img){img=r2;msg=`Foto enderezada automáticamente (inclinación ${a.tilt.toFixed(1)}°).`+(a.level==='bad'?' Para más precisión, repítela de frente.':'')}}list=FotoAuto.detect(img,null)}catch(err){}
  busy.close(true);
  if(!list.length){dialog('Detectar huecos',(msg?msg+' ':'')+'No he encontrado puertas, ventanas ni enchufes claros. Prueba con la pared de frente y bien iluminada.',[{id:'ok',label:'Cerrar',kind:'primary'}]);return}
  if(msg)toast(msg,5000);
  roomPhotoSheet(r,w,made.rec,img,list);
}
