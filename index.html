@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}

<style>
/* Layout: one-screen app with three views — gallery (photos / projects), project, editor. Dark-only by choice so photos read true. */
:root{
  --bg:#141619; --panel:#1d2024; --raise:#272b30; --line:#353a41;
  --fg:#ecebe6; --muted:#9a9fa6; --accent:#ffb21a; --accent-ink:#1b1400; --accent-text:#ffb21a;
  --danger:#ff5a4f; --hud:rgba(20,22,25,.9); --grid:rgba(255,255,255,.025); --field:#7a808a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-tema="light"],:root[data-tema="auto"][data-theme="light"]{
  --bg:#f2f1ed; --panel:#ffffff; --raise:#e9e8e3; --line:#d6d4cd;
  --fg:#1b1d20; --muted:#62666c; --accent:#f5a300; --accent-ink:#1b1400; --accent-text:#9a6100;
  --danger:#b3261e; --hud:rgba(255,255,255,.94); --grid:rgba(0,0,0,.045); --field:#7b8088; color-scheme:light;
}
@media (prefers-color-scheme: light){:root[data-tema="auto"]:not([data-theme="dark"]){
  --bg:#f2f1ed; --panel:#ffffff; --raise:#e9e8e3; --line:#d6d4cd;
  --fg:#1b1d20; --muted:#62666c; --accent:#f5a300; --accent-ink:#1b1400; --accent-text:#9a6100;
  --danger:#b3261e; --hud:rgba(255,255,255,.94); --grid:rgba(0,0,0,.045); --field:#7b8088; color-scheme:light;
}}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.app{height:100%;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.band{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.top{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;display:flex;align-items:center;gap:8px;min-height:44px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b span{color:var(--accent-text)}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.sub.on{color:var(--accent-text)}
body.in-editor #ctx:not([hidden])~#scaleInfo,#stage:has(.ctxbar:not([hidden])) #scaleInfo{display:none}
.titlebtn{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:2px 4px;border-radius:8px}
.titlebtn:hover{background:var(--raise)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;flex:none}
.ib:hover{background:var(--raise)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--raise)}
.btn.danger{background:rgba(255,90,79,.14);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.saved{background:transparent;color:var(--muted);font-weight:400}

/* gallery */
.tabs{display:flex;gap:4px;padding-block:10px 4px;background:var(--bg)}
.tabs button{flex:1;max-width:180px;height:36px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scroll{flex:1;min-height:0;overflow:auto;padding-block:10px 16px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.grid.sz-s{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.grid.sz-l{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
@media (max-width:380px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{position:relative;display:flex;flex-direction:column;gap:6px;cursor:pointer;border-radius:12px;min-width:0;touch-action:manipulation}
.thumb{aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-touch-callout:none}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--line)}
.mosaic img,.mosaic i{width:100%;height:100%;object-fit:cover;display:block;background:var(--panel);min-height:0}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline:2px}
.meta b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--accent-text)}
.chk{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:none;place-items:center}
.selmode .chk{display:grid}
.card.on .thumb{outline:3px solid var(--accent);outline-offset:-3px}
.card.on .chk{background:var(--accent);border-color:var(--accent)}
.card.on .chk::after{content:"";width:10px;height:6px;border:solid var(--accent-ink);border-width:0 0 3px 3px;transform:translateY(-1px) rotate(-45deg)}
.grid.sz-s{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.grid.sz-l{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
@media (max-width:380px){.grid.sz-s{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.sz-l{grid-template-columns:1fr}}
.grid.sz-s .meta b{font-size:12.5px}.grid.sz-s .meta span{font-size:11px}
.sgroup{max-width:640px;margin:0 auto 18px;display:flex;flex-direction:column}
.sgroup>h3{margin:4px 4px 8px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.srow:first-child{border-top:0}
.sl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}
.sl b{font-size:15px}.sl small{font-size:12.5px;color:var(--muted);line-height:1.35}
.seg{display:flex;background:var(--raise);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:32px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--field);transition:background .15s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.tin{background:var(--bg);color:var(--fg);border:1px solid var(--field);border-radius:10px;font:inherit;font-size:15px;padding:8px 10px;min-width:0;width:100%;max-width:260px;-webkit-user-select:text;user-select:text}
.cloudic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font-family:var(--f-display);font-weight:700;font-size:15px}
.status{font-size:12.5px}.status.on{color:var(--accent-text)}
.stylepv{width:120px;height:44px;border-radius:8px;flex:none}
.secbtn{width:100%;text-align:left;cursor:pointer;flex-wrap:nowrap;color:var(--fg)}
.secbtn:hover{background:var(--raise)}
.secic{width:26px;height:26px;color:var(--accent-text);flex:none}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.about{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5;padding:4px 0 20px}
.src{display:flex;flex-direction:column;gap:10px}
.src .btn{height:56px;font-size:16px;justify-content:flex-start;padding:0 16px}
.empty{max-width:340px;margin:48px auto;text-align:center;color:var(--muted);line-height:1.5;font-size:15px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:22px;margin-bottom:6px}
.warn{background:rgba(255,178,26,.14);color:var(--accent-text);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.4}
.bar{background:var(--panel);border-top:1px solid var(--line);padding-block:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar .btn.big{flex:1;max-width:320px;height:46px;font-size:15px}
.acts{display:flex;gap:4px;justify-content:space-around;width:100%;max-width:520px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;border-radius:10px;font-size:12px;flex:1;min-width:0}
.act:disabled{opacity:.35;cursor:default}
.act.danger{color:var(--danger)}
.act:not(:disabled):hover{background:var(--raise)}

/* editor */
.stage{position:relative;flex:1;min-height:0;background:
  repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,var(--grid) 23px 24px),var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#loupeBox{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:2}
#loupeBox.right{left:auto;right:max(12px,env(safe-area-inset-right,0px))}
#loupe{display:block;width:150px;height:150px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;background:#000}
#loupeInfo{background:var(--hud);border:1px solid var(--line);color:var(--fg);font-family:var(--f-display);font-weight:700;font-size:15px;padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.ctxbar{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:12px;max-width:calc(100% - 78px);overflow-x:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ctxbar .btn{height:36px;font-size:13px;padding:0 12px}
.ctxbar .del{color:var(--danger)}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 4px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--fg)}
.cbtn:hover{background:var(--raise)}
.cbtn svg{width:21px;height:21px}
#ctx{left:50%;transform:translateX(-50%);max-width:calc(100% - 20px)}
.ctxbar .btn.primary{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:999px;background:var(--raise);font-weight:700;font-family:var(--f-display);font-size:17px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fab{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:2px;background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:3px;z-index:1}
.fab .ib{width:38px;height:38px}
.fab .ib:disabled{opacity:.3}
.hint{position:absolute;left:calc(50% - 26px);top:12px;transform:translateX(-50%);background:var(--hud);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;white-space:normal;text-align:center;line-height:1.3;border-radius:14px;pointer-events:none;max-width:calc(100% - 96px);overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.hint.fade{opacity:0}
.toolbar{background:var(--panel);border-top:1px solid var(--line);padding-block:6px 8px;display:flex;gap:4px;justify-content:center}
.tool{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted)}
.tool span{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.tool[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent)}
.tool:not([aria-pressed="true"]):hover{color:var(--fg);background:var(--raise)}
.sep{width:1px;background:var(--line);margin:6px 4px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--fg);box-sizing:border-box}

/* modals */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 56px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.scrim.bottom{align-items:flex-end;padding-top:0;padding-left:0;padding-right:0}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:420px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);box-sizing:border-box;margin-bottom:24px}
.scrim.bottom .sheet{max-width:560px;border-radius:16px 16px 0 0;margin:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.02em}
.sheet h3{margin:4px 0 0;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p.txt{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
.field{display:flex;gap:8px}
.sheet input[type=text],.sheet textarea,.sheet select{background:var(--bg);color:var(--fg);border:1px solid var(--field);border-radius:10px;font:inherit;font-size:18px;padding:10px 12px;min-width:0;-webkit-user-select:text;user-select:text}
.sheet input[type=text]{flex:1}
.sheet input.num{font-family:var(--f-display);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.sheet textarea{resize:vertical;min-height:72px;width:100%;box-sizing:border-box}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.check small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.col .btn{width:100%}
.measured{font-size:13px;color:var(--muted);margin:0}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--fg);border-color:transparent}
.opt{flex:1;min-width:64px;height:48px;border-radius:10px;background:var(--raise);color:var(--muted);display:grid;place-items:center;border:1px solid transparent}
.opt[aria-pressed="true"]{background:var(--bg);border-color:var(--accent);color:var(--fg)}
.opt i{display:block;width:34px;background:currentColor;border-radius:3px}
.opt em{font-style:normal;font-family:var(--f-display);font-weight:700;line-height:1}
.note{font-size:12.5px;color:var(--muted);margin:0}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.4}
.steps a{color:var(--accent-text)}
.sheet{max-height:calc(100% - 24px);overflow:auto}
.pvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pvgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pv{height:auto;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px 4px 6px;min-width:0}
.pv canvas{width:100%;height:52px;border-radius:6px;display:block}
.pv small{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.plist{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.plist button{text-align:left;padding:12px;border-radius:10px;background:var(--raise);font-weight:700}
.plist button span{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.previews{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto}
.previews img{width:100%;border-radius:8px;border:1px solid var(--line);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:40}
body.in-editor .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
.toast{transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin:4px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:420px){.hide-sm{display:none}.btn{padding:0 11px}}
/* landscape phones: controls in two slim side rails, photo uses the full height */
@media (orientation:landscape) and (max-height:560px){
  #editor{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr)}

function openModal(html,{bottom=false,onClose}={}){

  wrap.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=focusables();if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}});

async function doBack(){

  const est=S?`Medida estimada con la escala: ${fmt(S.w/TOMM[u],u)} × ${fmt(S.h/TOMM[u],u)} ${u}`:'';
  const m=openModal(`<form class="sheet" autocomplete="off"><h2>${o.type==='rect'?'Rectángulo':circ?'Círculo':'Elipse'}</h2>
    <label class="check"><input type="checkbox" id="shAuto" ${o.auto&&hasScale()?'checked':''} ${hasScale()?'':'disabled'}><span>Calcular con la escala de la foto<small>${hasScale()?esc(est):'Esta foto no tiene escala: escribe las medidas reales o marca una cota de referencia.'}</small></span></label>
    ${o.type==='ellipse'?`<div class="seg" id="shKind" style="align-self:flex-start"><button type="button" data-k="c" aria-pressed="${circ}">Círculo perfecto</button><button type="button" data-k="e" aria-pressed="${!circ}">Elipse</button></div>`:''}
    <div class="field" id="shMan"><input type="text" class="num" id="shW" inputmode="decimal" placeholder="${o.type==='rect'?'Ancho':circ?'Diámetro':'Ancho'}" value="${esc(v(o.mw))}" aria-label="Ancho o diámetro"><input type="text" class="num" id="shH" inputmode="decimal" placeholder="Alto" value="${esc(v(o.mh))}" aria-label="Alto" ${circ?'hidden':''}>
      <select id="shU" aria-label="Unidad">${['mm','cm','m','in'].map(x=>`<option ${x===u?'selected':''}>${x}</option>`).join('')}</select></div>
    <h3>Mostrar en la foto</h3>
    <label class="check"><input type="checkbox" id="shD" ${sh.dims?'checked':''}><span>${o.type==='rect'?'Ancho y alto':circ?'Diámetro':'Medidas'}</span></label>
    <label class="check" id="shRrow" ${circ?'':'hidden'}><input type="checkbox" id="shR" ${sh.radius?'checked':''}><span>Radio</span></label>
    <label class="check"><input type="checkbox" id="shA" ${sh.area?'checked':''}><span>Área</span></label>
    <div class="row"><button type="button" class="btn ghost" data-c>${isNew?'Sin medidas':'Cancelar'}</button><button type="submit" class="btn primary">Aceptar</button></div></form>`,{onClose:()=>{if(isNew){commit();ui();render()}}});
  const f=m.wrap.querySelector('form'),auto=f.querySelector('#shAuto'),man=f.querySelector('#shMan'),upd=()=>{man.style.opacity=auto.checked?.45:1};auto.onchange=upd;upd();
  let kind=circ?'c':'e';const kb=f.querySelector('#shKind');
  if(kb)kb.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;kind=b.dataset.k;kb.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const c=kind==='c';f.querySelector('#shH').hidden=c;f.querySelector('#shW').placeholder=c?'Diámetro':'Ancho';f.querySelector('#shRrow').hidden=!c});
  f.querySelector('[data-c]').onclick=()=>m.close();
  f.onsubmit=e=>{e.preventDefault();o.unit=f.querySelector('#shU').value;lastUnit=o.unit;o.auto=auto.checked&&hasScale();
    const isC=o.type==='ellipse'&&kind==='c',w=parseNum(f.querySelector('#shW').value),hEl=f.querySelector('#shH'),h=hEl&&!hEl.hidden?parseNum(hEl.value):NaN;
    if(!o.auto){if(!(w>0)){toast(isC?'Escribe el diámetro':'Escribe el ancho');return}o.mw=w;o.mh=isC?w:(h>0?h:w)}
    if(o.type==='ellipse'){if(isC){makeCircle(o);o.ellipseChosen=false}else{o.circle=false;o.ellipseChosen=true}}
    o.show={dims:f.querySelector('#shD').checked?1:0,area:f.querySelector('#shA').checked?1:0,radius:f.querySelector('#shR').checked?1:0};
    m.close(true);commit();ui();render()};
  setTimeout(()=>{if(!o.auto)f.querySelector('#shW').focus()},60);
}
function openValueSheet(i,isNew,p){
  if(i>=0&&objs[i]&&(objs[i].type==='rect'||objs[i].type==='ellipse'))return openShapeSheet(i,isNew);
  if(i>=0&&objs[i]&&objs[i].type==='plane')return openPlaneSheet(i,isNew);
  const o=i>=0?objs[i]:null,kind=o?o.type:'text';let m;
  if(kind==='dim'){
    const pre=o.val;
    m=openModal(`<form class="sheet" autocomplete="off"><h2>${isNew?'Nueva cota':'Editar cota'}</h2>
      <div class="field"><input type="text" class="num" id="fVal" inputmode="decimal" placeholder="Ej. 120" value="${esc(o.val||'')}" aria-label="Valor de la cota">
      <select id="fUnit" aria-label="Unidad">${['mm','cm','m','in',''].map(u=>`<option value="${u}" ${u===(o.unit??lastUnit)?'selected':''}>${u||'—'}</option>`).join('')}</select></div>
      <p class="measured" id="fMeas">${hasScale()?'Medida estimada con la escala: '+esc(autoVal(o)+' '+(o.unit||'')):'Escribe la medida real que tomaste con el metro.'}</p>
      <label class="check"><input type="checkbox" id="fRef" ${o.ref?'checked':''}><span>Usar como medida de referencia<small>Calibra la escala de la foto con esta cota: las siguientes se rellenarán solas.</small></span></label>
      <div class="row"><button type="button" class="btn ghost" data-c>Cancelar</button><button type="submit" class="btn primary">Aceptar</button></div></form>`,
      {onClose:()=>{if(isNew){objs.splice(i,1);sel=-1;ui();render()}}});
    const f=m.wrap.querySelector('form'),val=f.querySelector('#fVal'),unit=f.querySelector('#fUnit'),ref=f.querySelector('#fRef');
    unit.onchange=()=>{if(!calib)return;const was=o.unit;o.unit=unit.value;if(!ref.checked&&(o.auto||!val.value))val.value=autoVal(o);f.querySelector('#fMeas').textContent='Medida estimada con la escala: '+autoVal(o)+' '+o.unit;if(!isNew)o.unit=was};
    f.querySelector('[data-c]').onclick=()=>m.close();
    f.onsubmit=e=>{e.preventDefault();const v=val.value.trim(),n=parseNum(v);
      if(ref.checked&&!(n>0)){val.focus();f.querySelector('#fMeas').textContent='Para usarla como referencia escribe un número, por ejemplo 120.';return}
      o.unit=unit.value;lastUnit=o.unit;o.val=v;
      o.auto=!!calib&&!ref.checked&&(v===''||(v===pre&&o.auto));if(o.auto&&!v)o.val=autoVal(o);
      if(ref.checked){objs.forEach(x=>x.ref=false);o.ref=true;o.auto=false;setPpmm(len(o.a,o.b)/(n*TOMM[o.unit||'mm']))}
      else if(o.ref){o.ref=false;clearPpmm()}
      recalc();m.close(true);commit();render();
    };
    setTimeout(()=>{val.focus();val.select()},60);
  }else{
    m=openModal(`<form class="sheet" autocomplete="off"><h2>${isNew?'Nuevo texto':'Editar texto'}</h2><textarea id="fText" aria-label="Texto de la nota" placeholder="Escribe una nota">${esc(o?o.text:'')}</textarea>
      <div class="row">${!isNew?'<button type="button" class="btn danger" data-d>Eliminar</button>':''}<button type="button" class="btn ghost" data-c>Cancelar</button><button type="submit" class="btn primary">Aceptar</button></div></form>`);
    const f=m.wrap.querySelector('form'),ta=f.querySelector('textarea');
    f.querySelector('[data-c]').onclick=()=>m.close();
    const dd=f.querySelector('[data-d]');if(dd)dd.onclick=()=>{objs.splice(i,1);sel=-1;m.close(true);commit();render()};
    f.onsubmit=e=>{e.preventDefault();const t=ta.value.replace(/\s+$/,'');m.close(true);
      if(isNew){if(t){objs.push({type:'text',x:p.x,y:p.y,text:t,color:style.color,fs:TS[style.ts]*U,w:LW[style.lw]*U});sel=objs.length-1;commit()}}
      else if(!t){objs.splice(i,1);sel=-1;commit()}else{o.text=t;commit()}
      ui();render()};
    setTimeout(()=>ta.focus(),60);
  }
}
document.addEventListener('keydown',e=>{
  if(modals.length){if(e.key==='Escape')modals[modals.length-1].close();return}
  if($('#editor').hidden)return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel>=0){e.preventDefault();$('#cDel').click()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?$('#redo').click():$('#undo').click()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(dirty())saveEditor()}
  if(e.key==='Escape'){sel=-1;ui();render()}
});

const scanURLs=new Map();
function scanThumbs(sc){const out=[];(sc.thumbs||[]).slice(0,4).forEach((b,i)=>{const k=sc.id+'_'+i;let u=scanURLs.get(k);if(!u){u=URL.createObjectURL(b);scanURLs.set(k,u)}out.push(`<img src="${u}" alt="">`)});return out.join('')+'<i></i>'.repeat(Math.max(0,4-out.length))}
let SC=null;
async function startScan(resume){
  if(!resume){const r=await dialog('Captura 3D','Para un buen modelo 3D: 1) Pon la pieza en una mesa con buena luz y un fondo con dibujo o textura. 2) Deja al lado una regla o una moneda para tener la escala. 3) No muevas la pieza: muévete tú alrededor. 4) Da tres vueltas (baja, media y alta) haciendo una foto cada pocos pasos, 40–80 fotos en total. 5) Que cada foto comparta buena parte con la anterior.',[{id:'y',label:'Empezar',kind:'primary'},{id:'n',label:'Cancelar'}]);if(r!=='y')return}
  const now=Date.now(),d=new Date(now);
  SC=resume?{...resume,photos:null,isNew:false}:{id:uid(),name:'Pieza '+d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),created:now,updated:now,count:0,thumbs:[],cover:{0:[],1:[],2:[]},isNew:true};
  SC.level=0;SC.sharp=[];SC.pending=[];
  pushView({v:'scan'});
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:4096},height:{ideal:3072}}});
    SC.stream=st;const v=$('#scVideo');v.srcObject=st;await v.play().catch(()=>{});
    const tr=st.getVideoTracks()[0];try{if(window.ImageCapture)SC.ic=new ImageCapture(tr)}catch(e){}
  }catch(e){toast('No se pudo abrir la cámara. Revisa el permiso de cámara de MedLoM.');requestBack();return}
  try{window.addEventListener('deviceorientation',scanOrient)}catch(e){}
  scanUI();
}
function stopScanCam(){if(SC&&SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}try{window.removeEventListener('deviceorientation',scanOrient)}catch(e){}}
function scanOrient(e){if(!SC)return;if(e.alpha!=null)SC.heading=e.alpha;if(e.beta!=null){const b=e.beta;SC.autoLevel=b>75?0:b>45?1:2}}
function scanUI(){
  if(!SC)return;$('#scTitle').textContent=SC.name;
  const n=SC.count+SC.pending.length;$('#scInfo').textContent=`${n} ${n===1?'foto':'fotos'} · recomendadas 40–80`;
  $('#scLevel').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===SC.level));
  const c=$('#scRing'),g=c.getContext('2d'),W2=c.width,cx=W2/2;g.clearRect(0,0,W2,W2);
  [0,1,2].forEach(l=>{const R=W2*0.44-l*W2*0.12,seg=24,cov=SC.cover[l]||[];for(let i=0;i<seg;i++){const a0=(i/seg)*Math.PI*2-Math.PI/2,a1=a0+Math.PI*2/seg-0.06;g.beginPath();g.arc(cx,cx,R,a0,a1);g.lineWidth=W2*0.07;g.strokeStyle=cov.includes(i)?'#ffb21a':l===SC.level?'rgba(255,255,255,.55)':'rgba(255,255,255,.2)';g.stroke()}});
}
function sharpness(canvas){const w=160,h=Math.round(canvas.height*160/canvas.width),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(canvas,0,0,w,h);const d=g.getImageData(0,0,w,h).data;
  const L=new Float32Array(w*h);for(let i=0;i<w*h;i++)L[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;let s1=0,s2=0,n=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,v=4*L[i]-L[i-1]-L[i+1]-L[i-w]-L[i+w];s1+=v;s2+=v*v;n++}const m=s1/n;return s2/n-m*m}
let scMsgT;function scMsg(t){const e=$('#scMsg');e.textContent=t;e.hidden=false;clearTimeout(scMsgT);scMsgT=setTimeout(()=>e.hidden=true,2600)}
$('#scShot').onclick=async()=>{
  if(!SC||!SC.stream||SC.busy)return;SC.busy=true;const btn=$('#scShot');btn.style.background='#fff';
  try{
    let blob=null;
    if(SC.ic){try{blob=await SC.ic.takePhoto()}catch(e){blob=null}}
    let canvas;
    if(blob){const bm=await bitmapOf(blob,true);canvas=document.createElement('canvas');canvas.width=bm.naturalWidth||bm.width;canvas.height=bm.naturalHeight||bm.height;canvas.getContext('2d').drawImage(bm,0,0)}
    else{const v=$('#scVideo');canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;canvas.getContext('2d').drawImage(v,0,0);blob=await toBlob(canvas,'image/jpeg',0.93)}
    const sh=sharpness(canvas),med=SC.sharp.length?SC.sharp.slice().sort((a,b)=>a-b)[Math.floor(SC.sharp.length/2)]:sh;
    if(SC.sharp.length>=3&&sh<med*0.35){scMsg('Foto movida: no se ha guardado. Quédate quieto y repítela.');buzz();return}
    SC.sharp.push(sh);
    const lv=SC.autoLevel!=null?SC.autoLevel:SC.level;if(SC.autoLevel!=null&&SC.autoLevel!==SC.level){SC.level=SC.autoLevel}
    if(SC.heading!=null){const segI=Math.floor(((360-SC.heading)%360)/15);const cv=SC.cover[lv]||(SC.cover[lv]=[]);if(!cv.includes(segI))cv.push(segI)}
    else{const cv=SC.cover[lv]||(SC.cover[lv]=[]);cv.push(cv.length%24)}
    SC.pending.push(blob);
    if(SC.thumbs.length<4){const t=document.createElement('canvas'),k=240/Math.max(canvas.width,canvas.height);t.width=Math.round(canvas.width*k);t.height=Math.round(canvas.height*k);t.getContext('2d').drawImage(canvas,0,0,t.width,t.height);SC.thumbs.push(await toBlob(t,'image/jpeg',0.8))}
    buzz();scanUI();if(SC.pending.length>=5)await flushScan();
  }catch(e){scMsg('No se pudo hacer la foto')}
  finally{SC&&(SC.busy=false);setTimeout(()=>btn.style.background='rgba(255,255,255,.25)',120)}
};
$('#scLevel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!SC)return;SC.level=+b.dataset.v;SC.autoLevel=null;scanUI()});
async function flushScan(){
  if(!SC||!SC.pending.length)return;
  const rec=(await getOne('scans',SC.id))||{id:SC.id,name:SC.name,created:SC.created,photos:[]};
  rec.photos=(rec.photos||[]).concat(SC.pending);SC.count=rec.photos.length;SC.pending=[];
  Object.assign(rec,{name:SC.name,updated:Date.now(),count:SC.count,thumbs:SC.thumbs,cover:SC.cover});
  await put('scans',rec);const i=store.scans.findIndex(x=>x.id===rec.id);const lite={...rec};delete lite.photos;if(i>=0)store.scans[i]=lite;else store.scans.push(lite);
}

$('#scDone').onclick=finishScan;$('#scBack').onclick=finishScan;

    const u=dv.getUint32(o,le);[.001,.0001,.01,.00001].forEach(sc=>c.push({uuid,kind:'u32',off:o,le,scale:sc,v:u*sc}))}

}

  pv.busy=true;setPv(pv,'busy');let changed=false;
  try{
    const J=(a,b)=>a?a+'/'+b:b,root=pv.root?pv.root():((SET.cloudFolder||'MedLoM').trim()||'MedLoM'),data=J(root,DATA_DIR);
    await pv.mkdir(data);
    let man=null;try{const t=await pv.getText(data+'/indice.json');if(t)man=JSON.parse(t)}catch(e){if(e.auth)throw e}
    man=man&&man.v?man:{v:1,photos:{},projects:[],deleted:{}};
    const before=JSON.stringify(man);
    const sampleIds=new Set(store.projects.filter(isSampleProj).map(p=>p.id));
    const myTombs=tombsFor(pv.id);
    /* projects */
    const gone={...(man.deleted||{})};myTombs.filter(t=>t.type==='project').forEach(t=>{gone[t.id]=Math.max(gone[t.id]||0,t.at)});
    const merged=new Map();(man.projects||[]).forEach(p=>merged.set(p.id,p));
    const oldNames=new Map((man.projects||[]).map(p=>[p.id,p.name]));
    store.projects.filter(p=>!sampleIds.has(p.id)).forEach(p=>{const r=merged.get(p.id);if(!r||(p.updated||0)>=(r.updated||0))merged.set(p.id,{id:p.id,name:p.name,created:p.created,updated:p.updated,notes:p.notes||null})});
    for(const [id,at] of Object.entries(gone)){const p=merged.get(id);if(p&&(p.updated||0)<=at)merged.delete(id)}
    for(const p of merged.values()){const l=projById(p.id);if(!l){const n={...p};store.projects.push(n);await put('projects',n);changed=true}else if((p.updated||0)>(l.updated||0)){Object.assign(l,{name:p.name,updated:p.updated,notes:p.notes||l.notes||null});await put('projects',l);changed=true}}
    for(const l of store.projects.slice()){if(sampleIds.has(l.id)||merged.has(l.id))continue;if(gone[l.id]){await del('projects',l.id);store.projects=store.projects.filter(x=>x.id!==l.id);for(const ph of store.photos)if(ph.projectId===l.id){ph.projectId=null;await put('photos',ph)}changed=true}}
    man.projects=[...merged.values()];man.deleted=gone;
    const folderOf=pid=>J(root,safe(pid&&merged.get(pid)?merged.get(pid).name:'Sin proyecto'));
    /* deleted photos */
    for(const t of myTombs.filter(t=>t.type==='photo')){
      const m=man.photos[t.id]||{};
      if(m.a)await pv.del(m.a).catch(()=>{});
      await pv.del(`${data}/f_${t.id}.json`).catch(()=>{});await pv.del(`${data}/f_${t.id}.jpg`).catch(()=>{});
      man.photos[t.id]={u:t.at,d:1};
    }
    /* upload local changes */
    const Q=EXQ[SET.expQuality]||EXQ.high;const made=new Set();
    for(const r of store.photos.slice()){
      if(sampleIds.has(r.projectId))continue;
      if(rec&&rec.id===r.id&&dirty())continue;
      await ready(r);if(!r.img)continue;
      const m=man.photos[r.id],ru=m?m.u:-1;
      if(m&&m.d&&(r.updated||0)<=ru)continue;
      const dest=folderOf(r.projectId&&!sampleIds.has(r.projectId)?r.projectId:null)+'/'+safe(r.name)+'.jpg';
      const newer=!m||(r.updated||0)>ru,moved=m&&!m.d&&m.a!==dest&&(r.updated||0)===ru;
      if(!newer&&!moved)continue;
      const imgRev=String(r.imgRev||0);
      if(!m||m.d||m.i!==imgRev)await pv.put(`${data}/f_${r.id}.jpg`,r.img);
      const dir=dest.slice(0,dest.lastIndexOf('/'));if(!made.has(dir)){await pv.mkdir(dir);made.add(dir)}
      if(m&&m.a&&m.a!==dest)await pv.del(m.a).catch(()=>{});
      await pv.put(dest,await toBlob(await renderAnnotated(r,Q.max||3200),'image/jpeg',Q.q));
      const meta={id:r.id,name:r.name,projectId:r.projectId||null,created:r.created,updated:r.updated,w:r.w,h:r.h,objs:r.objs||[],calib:r.calib||null,imgRev:r.imgRev||0};
      await pv.put(`${data}/f_${r.id}.json`,JSON.stringify(meta));
      man.photos[r.id]={u:r.updated,a:dest,i:imgRev};
    }
    /* folders of deleted or renamed projects */
    for(const [id,name] of oldNames){const now=merged.get(id);if(!now||now.name!==name){const keep=[...made].some(d=>d===J(root,safe(name)));if(!keep)await pv.delDir(J(root,safe(name))).catch(()=>{})}}
    /* download remote changes */
    for(const [id,m] of Object.entries(man.photos)){
      if(rec&&rec.id===id)continue;
      const l=store.photos.find(p=>p.id===id);
      if(m.d){if(l&&(l.updated||0)<=m.u&&!sampleIds.has(l.projectId)){await del('photos',id);store.photos=store.photos.filter(p=>p.id!==id);changed=true}continue}
      if(l&&(l.updated||0)>=m.u)continue;
      const t=await pv.getText(`${data}/f_${id}.json`);if(!t)continue;
      const meta=JSON.parse(t);
      let img=l&&l.img;
      if(!img||String(l.imgRev||0)!==String(meta.imgRev||0)){img=await pv.getBlob(`${data}/f_${id}.jpg`);if(!img)continue}
      const n={...(l||{}),...meta,objs:meta.objs||[],calib:meta.calib||null,img:img.type==='image/jpeg'?img:new Blob([img],{type:'image/jpeg'}),thumb:null};
      if(n.projectId&&!projById(n.projectId))n.projectId=null;
      n.thumb=await makeThumb(n);await put('photos',n);
      if(l)Object.assign(l,n);else store.photos.push(n);changed=true;
    }
    if(JSON.stringify(man)!==before)await pv.put(data+'/indice.json',JSON.stringify(man));
    tombsDone(pv.id,myTombs);
    SET[pv.set]={...(SET[pv.set]||{}),lastSync:Date.now()};saveSettings();
    pv.busy=false;setPv(pv,'ok');
    if(manual&&!SYNC_ALL)toast(pv.name+' al día');
  }catch(e){
    pv.busy=false;
    if(e.auth){setPv(pv,'error','vuelve a conectar '+pv.name)}
    else setPv(pv,'error',/internet|Failed to fetch|NetworkError/i.test(e.message)?'sin conexión a internet':e.message);
    if(manual)toast('No se pudo sincronizar con '+pv.name);
  }finally{
    pv.busy=false;
    if(changed&&!$('#gallery').hidden)renderGallery();
    if(pv.again){pv.again=false;scheduleSync(800)}
  }
}
