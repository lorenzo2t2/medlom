<style>
/* Layout: one-screen app with three views — gallery (photos / projects), project, editor.
   Themes: dark, light, warm light, auto, high-contrast, sepia, blue-pro, forest, midnight */
:root, :root[data-tema="dark"]{
  --bg:#141619; --panel:#1d2024; --raise:#272b30; --line:#353a41;
  --fg:#ecebe6; --muted:#9a9fa6; --accent:#ffb21a; --accent-ink:#1b1400; --accent-text:#ffb21a;
  --danger:#ff5a4f; --hud:rgba(20,22,25,.9); --grid:rgba(255,255,255,.025); --field:#7a808a;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --dim-halo:rgba(0,0,0,.72);
  color-scheme:dark;
}
:root[data-tema="light"]{
  --bg:#f2f1ed; --panel:#ffffff; --raise:#e9e8e3; --line:#d6d4cd;
  --fg:#1b1d20; --muted:#62666c; --accent:#f5a300; --accent-ink:#1b1400; --accent-text:#9a6100;
  --danger:#b3261e; --hud:rgba(255,255,255,.94); --grid:rgba(0,0,0,.045); --field:#7b8088;
  --dim-halo:rgba(255,255,255,.85);
  color-scheme:light;
}
:root[data-tema="cream"]{
  --bg:#f7f4ec; --panel:#fffdf8; --raise:#eee9dd; --line:#d8d0c0;
  --fg:#24231f; --muted:#55534c; --accent:#e2a000; --accent-ink:#241900; --accent-text:#744900;
  --danger:#a82d25; --hud:rgba(255,253,248,.96); --grid:rgba(45,38,25,.045); --field:#625e53;
  --dim-halo:rgba(255,255,255,.95);
  color-scheme:light;
}
:root[data-tema="high"]{
  --bg:#000000; --panel:#0a0a0a; --raise:#1a1a1a; --line:#3a3a3a;
  --fg:#ffffff; --muted:#c0c0c0; --accent:#ffff00; --accent-ink:#000000; --accent-text:#ffff00;
  --danger:#ff3333; --hud:rgba(0,0,0,.92); --grid:rgba(255,255,255,.04); --field:#aaaaaa;
  --dim-halo:rgba(0,0,0,.9);
  color-scheme:dark;
}
:root[data-tema="sepia"]{
  --bg:#f4ecd8; --panel:#faf6eb; --raise:#ebe4d4; --line:#d4c9b0;
  --fg:#3d2b1f; --muted:#7a6550; --accent:#c45c26; --accent-ink:#2a1508; --accent-text:#8a3d12;
  --danger:#a12c2c; --hud:rgba(250,246,235,.95); --grid:rgba(0,0,0,.04); --field:#8a7a65;
  --dim-halo:rgba(250,246,235,.9);
  color-scheme:light;
}
:root[data-tema="blue"]{
  --bg:#0d1b2a; --panel:#1b2838; --raise:#243447; --line:#3a4f66;
  --fg:#e8f1f8; --muted:#8fa3b8; --accent:#00d4ff; --accent-ink:#001a22; --accent-text:#00d4ff;
  --danger:#ff6b6b; --hud:rgba(13,27,42,.92); --grid:rgba(255,255,255,.03); --field:#7a92a8;
  --dim-halo:rgba(0,0,0,.75);
  color-scheme:dark;
}
:root[data-tema="forest"]{
  --bg:#0f1a14; --panel:#1a2a20; --raise:#24352c; --line:#354a3d;
  --fg:#e8f0e9; --muted:#8fa896; --accent:#7dce82; --accent-ink:#0a1a0c; --accent-text:#7dce82;
  --danger:#e85d5d; --hud:rgba(15,26,20,.92); --grid:rgba(255,255,255,.03); --field:#7a9680;
  --dim-halo:rgba(0,0,0,.75);
  color-scheme:dark;
}
:root[data-tema="midnight"]{
  --bg:#0a0e17; --panel:#121826; --raise:#1a2233; --line:#2a3548;
  --fg:#e6eaf2; --muted:#8b95a8; --accent:#ff9f1c; --accent-ink:#1a0f00; --accent-text:#ff9f1c;
  --danger:#ff5c5c; --hud:rgba(10,14,23,.93); --grid:rgba(255,255,255,.025); --field:#7a8499;
  --dim-halo:rgba(0,0,0,.78);
  color-scheme:dark;
}
/* auto follows system, mapped to dark or light */
:root[data-tema="auto"][data-theme="light"]{
  --bg:#f2f1ed; --panel:#ffffff; --raise:#e9e8e3; --line:#d6d4cd;
  --fg:#1b1d20; --muted:#62666c; --accent:#f5a300; --accent-ink:#1b1400; --accent-text:#9a6100;
  --danger:#b3261e; --hud:rgba(255,255,255,.94); --grid:rgba(0,0,0,.045); --field:#7b8088;
  --dim-halo:rgba(255,255,255,.85);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-tema="auto"]:not([data-theme="dark"]){
    --bg:#f2f1ed; --panel:#ffffff; --raise:#e9e8e3; --line:#d6d4cd;
    --fg:#1b1d20; --muted:#62666c; --accent:#f5a300; --accent-ink:#1b1400; --accent-text:#9a6100;
    --danger:#b3261e; --hud:rgba(255,255,255,.94); --grid:rgba(0,0,0,.045); --field:#7b8088;
    --dim-halo:rgba(255,255,255,.85);
    color-scheme:light;
  }
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.app{height:100%;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.band{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,label:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.top{background:var(--panel);border-bottom:1px solid var(--line);padding-block:8px;display:flex;align-items:center;gap:8px;min-height:44px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b span{color:var(--accent-text)}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.sub.on{color:var(--accent-text)}


.preview-sheet .prev-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;max-height:42vh;overflow:auto}
.preview-sheet .prev-grid figure{margin:0;background:var(--raise);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.preview-sheet .prev-grid img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.preview-sheet .prev-grid figcaption{font-size:11.5px;padding:6px 8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scaleInfo{cursor:pointer;-webkit-tap-highlight-color:transparent}
#scaleInfo:not(.on){border-color:var(--accent)!important;color:var(--accent-text)}
#scaleInfo.on{border-color:var(--line)}
body.in-editor #ctx:not([hidden])~#scaleInfo,#stage:has(.ctxbar:not([hidden])) #scaleInfo{display:none}
.titlebtn{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;padding:2px 4px;border-radius:8px}
.titlebtn:hover{background:var(--raise)}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;flex:none}
.ib:hover{background:var(--raise)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--raise)}
.btn.danger{background:rgba(255,90,79,.14);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.saved{background:transparent;color:var(--muted);font-weight:400}

/* gallery */
.tabs{display:flex;gap:4px;padding-block:10px 4px;background:var(--bg)}
.tabs button{flex:1;max-width:180px;height:36px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line)}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scroll{flex:1;min-height:0;overflow:auto;padding-block:10px 16px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.grid.sz-s{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.grid.sz-l{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}}
@media (max-width:380px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{position:relative;display:flex;flex-direction:column;gap:6px;cursor:pointer;border-radius:12px;min-width:0;touch-action:manipulation}
.thumb{aspect-ratio:4/3;max-width:100%;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-touch-callout:none}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--line)}
.mosaic img,.mosaic i{width:100%;height:100%;object-fit:cover;display:block;background:var(--panel);min-height:0}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0;padding-inline:2px}
.meta b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--accent-text)}
.chk{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:none;place-items:center}
.selmode .chk{display:grid}
.card.on .thumb{outline:3px solid var(--accent);outline-offset:-3px}
.card.on .chk{background:var(--accent);border-color:var(--accent)}
.card.on .chk::after{content:"";width:10px;height:6px;border:solid var(--accent-ink);border-width:0 0 3px 3px;transform:translateY(-1px) rotate(-45deg)}
.grid.sz-s{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.grid.sz-l{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
@media (max-width:380px){.grid.sz-s{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.sz-l{grid-template-columns:1fr}}
.grid.sz-s .meta b{font-size:12.5px}.grid.sz-s .meta span{font-size:11px}
.sgroup{max-width:640px;margin:0 auto 18px;display:flex;flex-direction:column}
.sgroup>h3{margin:4px 4px 8px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}.srow .seg{max-width:100%;justify-content:flex-start}
.srow:first-child{border-top:0}
.sl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}
.sl b{font-size:15px}.sl small{font-size:12.5px;color:var(--muted);line-height:1.35}
.seg{display:flex;background:var(--raise);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{height:32px;padding:0 9px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);transition:background .12s,color .12s,box-shadow .12s}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.28);outline:1px solid var(--accent);outline-offset:-1px}
.seg button:active{transform:scale(.97)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--field);transition:background .15s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.tin{background:var(--bg);color:var(--fg);border:1px solid var(--field);border-radius:10px;font:inherit;font-size:15px;padding:8px 10px;min-width:0;width:100%;max-width:260px;-webkit-user-select:text;user-select:text}
.cloudic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff;font-family:var(--f-display);font-weight:700;font-size:15px}
.status{font-size:12.5px}.status.on{color:var(--accent-text)}
.stylepv{width:120px;height:44px;border-radius:8px;flex:none}
.secbtn{width:100%;text-align:left;cursor:pointer;flex-wrap:nowrap;color:var(--fg)}
.secbtn:hover{background:var(--raise)}
.secic{width:26px;height:26px;color:var(--accent-text);flex:none}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.about{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5;padding:4px 0 20px}
.src{display:flex;flex-direction:column;gap:10px}
.src .btn{height:56px;font-size:16px;justify-content:flex-start;padding:0 16px}
.empty{max-width:360px;margin:56px auto;text-align:center;color:var(--muted);line-height:1.55;font-size:15px;padding:0 16px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.02em;margin-bottom:10px}
.empty::before{content:"+";display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:var(--raise);border:1px solid var(--line);color:var(--accent-text);font:400 32px/1 system-ui,sans-serif;animation:empty-pop .22s ease-out both}
@keyframes empty-pop{from{opacity:0;transform:scale(.9)}to{opacity:.9;transform:scale(1)}}
.empty-note{display:block;margin-top:14px;font-size:13.5px;color:var(--field);line-height:1.45}
.warn{background:rgba(255,178,26,.14);color:var(--accent-text);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.4}
.bar{background:var(--panel);border-top:1px solid var(--line);padding-block:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar .btn.big{flex:1;max-width:320px;height:46px;font-size:15px}
.acts{display:flex;gap:4px;justify-content:space-around;width:100%;max-width:520px}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 6px;border-radius:10px;font-size:12px;flex:1;min-width:0}
.act:disabled{opacity:.35;cursor:default}
.act.danger{color:var(--danger)}
.act:not(:disabled):hover{background:var(--raise)}

/* editor */
.stage{position:relative;flex:1;min-height:0;background:
  repeating-linear-gradient(0deg,transparent 0 23px,var(--grid) 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,var(--grid) 23px 24px),var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#loupeBox{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:2}
#loupeBox.right{left:auto;right:max(12px,env(safe-area-inset-right,0px))}
#loupe{display:block;width:150px;height:150px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;background:#000}
#loupeInfo{background:var(--hud);border:1px solid var(--line);color:var(--fg);font-family:var(--f-display);font-weight:700;font-size:15px;padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.ctxbar{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:12px;max-width:calc(100% - 78px);overflow-x:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ctxbar .btn{height:36px;font-size:13px;padding:0 12px}
.ctxbar .del{color:var(--danger)}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 4px;border-radius:9px;font-size:11.5px;font-weight:700;color:var(--fg)}
.cbtn:hover{background:var(--raise)}
.cbtn svg{width:21px;height:21px}
#ctx{left:50%;transform:translateX(-50%);max-width:calc(100% - 20px)}
.ctxbar .btn.primary{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 12px;border-radius:999px;background:var(--raise);font-weight:700;font-family:var(--f-display);font-size:17px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fab{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:2px;background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:3px;z-index:1}

async function convertInk(){
  if(!ink.length)return;
  const st=await nativeAsync('inkStatus');
  if(!st||!st.ok){toast('El reconocimiento de escritura no está disponible en este móvil');return}
  if(!st.ready){
    const r=await dialog('Descargar reconocimiento de escritura','La primera vez, MedLoM necesita descargar el reconocimiento de escritura en español (unos 20 MB). Después funciona sin internet.',[{id:'y',label:'Descargar',kind:'primary'},{id:'n',label:'Ahora no'}]);
    if(r!=='y')return;
    const m=openModal(`<div class="sheet"><h2>Descargando…</h2><p class="txt">Puede tardar un minuto según tu conexión.</p><div class="spin"></div></div>`);
    const d=await nativeAsync('inkDownload');m.close(true);
    if(!d||!d.ok){toast('No se pudo descargar. Comprueba la conexión a internet.');return}
  }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ink.forEach(s=>s.pts.forEach(q=>{x0=Math.min(x0,q.x);y0=Math.min(y0,q.y);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y)}));
  const strokes=ink.map(s=>s.pts.map(q=>[+(q.x-x0).toFixed(1),+(q.y-y0).toFixed(1),Math.round(q.t||0)]));
  const m=openModal(`<div class="sheet"><h2>Reconociendo…</h2><div class="spin"></div></div>`);
  const r=await nativeAsync('inkRecognize',JSON.stringify(strokes),Math.max(1,x1-x0),Math.max(1,y1-y0));m.close(true);
  const cands=(r&&r.ok&&r.candidates||[]).filter(Boolean);
  if(!cands.length){toast('No se ha reconocido nada. Escribe más grande y separado.');return}
  openInkSheet(cands,{x0,y0,w:x1-x0,h:y1-y0});
}
function openInkSheet(cands,box){
  const cx=box.x0+box.w/2,cy=box.y0+box.h/2;let dim=-1,best=1e9;
  objs.forEach((o,i)=>{if(o.type!=='dim')return;const g=dimLabel(o),d=Math.min(distSeg({x:cx,y:cy},o.a,o.b),len({x:cx,y:cy},{x:g.mx,y:g.my}));const lim=Math.max(box.h*1.3,o.fs*1.8);if(d<lim&&d<best){best=d;dim=i}});

    <div class="row"><button type="button" class="btn ghost" data-x>Volver a escribir</button><button type="submit" class="btn primary">Convertir</button></div></form>`);

  f.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v){inp.focus();return}m.close(true);
    const useDim=dim>=0&&f.querySelector('#inkDim')&&f.querySelector('#inkDim').checked;

    else{const fs=Math.max(TS[0]*U,Math.min(TS[3]*U*1.6,box.h*0.9));objs.push({type:'text',x:box.x0,y:box.y0,text:v,color:style.color,...SHD(),fs,w:LW[style.lw]*U});sel=objs.length-1}
    ink=[];inkUI();commit();toHand();render();toast(useDim?'Medida actualizada':'Convertido en texto')};

      const ablob=await toBlob(await renderAnnotated(r,Q.max||3200),'image/jpeg',Q.q);
      let annot=ap.annot;
      try{annot=await gUpload({id:annot||undefined,name:safe(r.name)+'.jpg',parent:dest,mime:'image/jpeg',data:ablob,props:{annotOf:r.id},move:annot?{from:ap.annotIn,to:dest}:null})}

    for(const f of byName.values()){

      const id=m[1],ap=f.appProperties||{},ru=+(ap.updated||0),l=store.photos.find(p=>p.id===id);

      if(!img||String((l&&l.imgRev)||0)!==String(meta.imgRev||0)){const ji=byName.get(`f_${id}.jpg`);if(!ji)continue;img=await gGet(ji.id)}
      const n={...(l||{}),...meta,objs:meta.objs||[],calib:meta.calib||null,img:img.type==='image/jpeg'?img:new Blob([img],{type:'image/jpeg'}),thumb:null};
      if(n.projectId&&!projById(n.projectId))n.projectId=null;
      n.thumb=await makeThumb(n);await put('photos',n);

    }
    SET.drive={...(SET.drive||{}),lastSync:Date.now()};saveSettings();
    DRIVE.busy=false;setDrive('ok');
    if(manual&&!SYNC_ALL)toast('Google Drive al día');

  }

/* laser: learn unknown protocols (Mileseey and others) */
const hexBytes=h=>{const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a};
const UNITM={m:1,cm:.01,mm:.001,ft:.3048,in:.0254};

  const c=[],dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  asciiNums(b).forEach((n,i)=>{if(n.u)c.push({uuid,kind:'ascii',idx:i,scale:UNITM[n.u]||1,v:n.v*(UNITM[n.u]||1)});else[1,.01,.001].forEach(sc=>c.push({uuid,kind:'ascii',idx:i,scale:sc,v:n.v*sc}))});

    const u=dv.getUint32(o,le);[.001,.0001,.01,.00001].forEach(sc=>c.push({uuid,kind:'u32',off:o,le,scale:sc,v:u*sc}))}
  for(let o=0;o+2<=b.length;o++)for(const le of[true,false]){const u=dv.getUint16(o,le);[.001,.0001,.01].forEach(sc=>c.push({uuid,kind:'u16',off:o,le,scale:sc,v:u*sc}))}
  return c;
}

  if(!rule||rule.uuid!==uuid)return null;const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  try{if(rule.kind==='ascii'){const n=asciiNums(b)[rule.idx];return n?n.v*rule.scale:null}
